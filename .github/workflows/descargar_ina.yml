name: Descarga Horaria Pronóstico INA

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: descarga-ina-group
  cancel-in-progress: false

jobs:
  ejecutar-descarga:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar script de descarga
        run: python descargar_prono.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Agrega los archivos modificados o creados por el script
          git add pronosticos_san_fernando.csv corridas_procesadas.txt

          # 2. Si hay cambios, hace commit local, rebase seguro y push
          if ! git diff --staged --quiet; then
            git commit -m "Auto: actualización corrida INA [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No se registraron cambios nuevos para commitear."
          fi